name: Testar FTP

on:
  push:
    branches:
      - main

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Testar diretório
        run: |
          lftp -c "
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ftp://ftp.ibnfamily.com.br;

            echo '=== RAIZ ===';
            ls -la;

            echo '=== LIVRO-A-LIVRO ===';
            cd livro-a-livro;
            pwd;
            ls -la;
          "