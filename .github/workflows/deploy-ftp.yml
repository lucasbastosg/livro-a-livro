name: Testar Caminhos FTP

on:
  push:
    branches:
      - main

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Testar caminhos FTP
        run: |
          lftp -c "
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ftp://ftp.ibnfamily.com.br;

            echo '=== DIRETORIO ATUAL ===';
            pwd;

            echo '=== TESTE 1: /www ===';
            cd /www;
            pwd;

            echo '=== TESTE 2: /www/livro-a-livro ===';
            cd /www/livro-a-livro;
            pwd;
          "